<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#111318" />

  <title>Feedback received — StemPlayer</title>

  <style>
    :root {
      --text: #f4f7fb;
      --muted: #a9b2c3;
      --line: rgba(255,255,255,.1);
      --accent: #f0b44d;
      --accent-2: #ffd98c;
      --max: 760px;
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(
          circle at 20% -10%,
          rgba(240,180,77,.12),
          transparent 34rem
        ),
        linear-gradient(
          180deg,
          #0b0d11 0%,
          #10131a 48%,
          #0b0d11 100%
        );
      line-height: 1.6;
    }

    .wrap {
      width: min(var(--max), calc(100% - 32px));
      margin: 0 auto;
    }

    nav {
      border-bottom: 1px solid var(--line);
      background: rgba(11,13,17,.76);
    }

    .nav-inner {
      min-height: 68px;
      display: flex;
      align-items: center;
    }

    .brand {
      color: var(--text);
      font-weight: 800;
      text-decoration: none;
    }

    .brand span { color: var(--accent); }

    main {
      min-height: calc(100vh - 69px);
      display: flex;
      align-items: center;
      padding: 60px 0;
    }

    .card {
      padding: 40px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,255,255,.035);
      text-align: center;
    }

    .eyebrow {
      color: var(--accent-2);
      font-weight: 750;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-size: .82rem;
    }

    h1 {
      margin: 10px 0 14px;
      font-size: clamp(2.3rem, 7vw, 4rem);
      line-height: 1.05;
      letter-spacing: -.045em;
    }

    p {
      color: var(--muted);
      font-size: 1.08rem;
      max-width: 560px;
      margin: 0 auto 28px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 22px;
      border-radius: 999px;
      background: var(--accent);
      color: #17120a;
      text-decoration: none;
      font-weight: 800;
    }

    @media (max-width: 600px) {
      .card { padding: 28px 20px; }
      .btn { width: 100%; }
    }
  </style>
</head>

<body>

  <nav>
    <div class="wrap nav-inner">
      <a class="brand" href="/">
        StemPlayer <span>V3</span>
      </a>
    </div>
  </nav>

  <main>
    <div class="wrap">
      <div class="card">

        <div class="eyebrow">Message received</div>

        <h1>Thanks for your feedback.</h1>

        <p>
          Your message has been sent to StemPlayer.
          Thanks for helping us understand how musicians
          use the app in real practice.
        </p>

        <a class="btn" href="/">
          Back to StemPlayer
        </a>

      </div>
    </div>
  </main>

</body>
</html>
